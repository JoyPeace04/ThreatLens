services:
  - type: web
    name: threatlens-api
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r backend/requirements.txt uvicorn==0.52.4
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: threatlens-db
          property: connectionString

databases:
  - name: threatlens-db
    region: singapore
    plan: free
